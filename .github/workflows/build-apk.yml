          cd game

          python3 - <<'PY'

          from PIL import Image

          base =
              Image.open(
                  "golden-g.png"
              ).convert("RGBA")


          sizes = {

              "mipmap-mdpi": 48,

              "mipmap-hdpi": 72,

              "mipmap-xhdpi": 96,

              "mipmap-xxhdpi": 144,

              "mipmap-xxxhdpi": 192

          }


          for folder, size in sizes.items():

              path =
                  f"android/app/src/main/res/{folder}"

              import os

              os.makedirs(
                  path,
                  exist_ok=True
              )


              image =
                  base.resize(
                      (size,size),
                      Image.Resampling.LANCZOS
                  )


              image.save(
                  f"{path}/ic_launcher.png"
              )


              image.save(
                  f"{path}/ic_launcher_round.png"
              )

          PY


