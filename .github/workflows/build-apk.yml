      # =========================================================

      - name: 🖼️ Set Android Icon
        run: |

          cd game/android

          find app/src/main \
            -type f \
            \( -name "*.xml" -o -name "*.kt" -o -name "*.java" \) \
            -print0 |
          xargs -0 sed -i \
            's/@mipmap\/ic_launcher/@mipmap\/icon/g'

          find app/src/main \
            -type f \
            \( -name "*.xml" -o -name "*.kt" -o -name "*.java" \) \
            -print0 |
          xargs -0 sed -i \
            's/@mipmap\/ic_launcher_round/@mipmap\/icon/g'


      # =========================================================
      # ANDROID GRADLE CONFIG
      # =========================================================

      - name: ⚙️ Configure Gradle
        run: |

          cd game/android

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


      # =========================================================
      # RELEASE SETTINGS
      # =========================================================

      - name: 🔧 Configure Release
        run: |

          cd game/android

          sed -i \
            's/minifyEnabled false/minifyEnabled true/g' \
            app/build.gradle


      # =========================================================
      # SIGNING KEY
      # =========================================================

      - name: 🔐 Create Release Key
        run: |

          mkdir -p game/keystore

          keytool \
            -genkeypair \
            -v \
            -keystore game/keystore/ultimate.jks \
            -alias ultimate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ultimate123 \
            -keypass ultimate123 \
            -dname \
            "CN=Ultimate Warriors, OU=Game, O=Ultimate Warriors, C=SA"


      # =========================================================
      # BUILD
      # =========================================================

      - name: 🔨 Build Release APK
        run: |

          cd game/android

          chmod +x gradlew

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # =========================================================
      # SIGN APK
      # =========================================================

      - name: 🔏 Sign APK
        run: |

          APK=$(find \
            game/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then

            echo "❌ APK NOT FOUND"

            exit 1

          fi


          apksigner sign \
            --ks game/keystore/ultimate.jks \
            --ks-key-alias ultimate \
            --ks-pass pass:ultimate123 \
            --key-pass pass:ultimate123 \
            "$APK"


      # =========================================================
      # VERIFY
      # =========================================================

      - name: 🔍 Verify APK
        run: |

          APK=$(find \
            game/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)


          apksigner verify \
            --verbose \
            "$APK"


          echo ""
          echo "======================================"
          echo "🐉 BUILD SUCCESS"
          echo "======================================"

          ls -lh "$APK"


      # =========================================================
      # COPY FINAL APK
      # =========================================================

      - name: 📦 Prepare Final APK
        run: |

          APK=$(find \
            game/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)


          cp \
            "$APK" \
            "ULTIMATE-WARRIORS-FINAL.apk"


      # =========================================================
      # SIZE CHECK
      # =========================================================

      - name: 📏 APK Size
        run: |

          echo "======================================"
          echo "📏 FINAL APK SIZE"
          echo "======================================"

          ls -lh \
            ULTIMATE-WARRIORS-FINAL.apk

          du -h \
            ULTIMATE-WARRIORS-FINAL.apk


      # =========================================================
      # UPLOAD
      # =========================================================

      - name: 🚀 Upload Final APK
        uses: actions/upload-artifact@v4

        with:

          name: ULTIMATE-WARRIORS-FINAL-APK

          path: ULTIMATE-WARRIORS-FINAL.apk

          if-no-files-found: error