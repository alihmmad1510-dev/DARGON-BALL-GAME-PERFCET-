name: 🐉 DRAGON BALL 678 - APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: 📥 Checkout
        uses: actions/checkout@v4


      # =========================
      # JAVA 21
      # =========================

      - name: ☕ Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # =========================
      # ANDROID
      # =========================

      - name: 📱 Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Android SDK Packages
        run: |

          sdkmanager "platform-tools"

          sdkmanager "platforms;android-35"

          sdkmanager "build-tools;35.0.0"


      # =========================
      # NODE 24
      # =========================

      - name: 🟢 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # =========================
      # CREATE GAME
      # =========================

      - name: 🎮 Create Dragon Ball Game
        run: |

          mkdir -p game

          cd game


          # -------------------------
          # PACKAGE
          # -------------------------

          cat > package.json <<'EOF'
          {
            "name": "dragon-ball-678",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


          # -------------------------
          # INSTALL
          # -------------------------

          npm install --omit=dev


          # -------------------------
          # CAPACITOR
          # -------------------------

          npx cap init \
            "DRAGON BALL 678" \
            "com.goku.dragonball678" \
            --web-dir=www


          # -------------------------
          # WEB
          # -------------------------

          mkdir -p www


          cat > www/index.html <<'EOF'

          <!DOCTYPE html>

          <html lang="ar">

          <head>

          <meta charset="UTF-8">

          <meta
          name="viewport"
          content="width=device-width,
          initial-scale=1,
          maximum-scale=1,
          user-scalable=no">

          <title>DRAGON BALL 678</title>


          <style>

          *{
            box-sizing:border-box;
            user-select:none;
          }


          html,
          body{

            margin:0;

            width:100%;
            height:100%;

            overflow:hidden;

            background:#02020b;

            color:white;

            font-family:Arial,sans-serif;

          }


          #game{

            position:absolute;

            inset:0;

            overflow:hidden;

            background:

            radial-gradient(
              circle at 50% 45%,
              #282080,
              #101038 35%,
              #02020b 85%
            );

          }


          #stars{

            position:absolute;

            inset:0;

            opacity:.4;

            background-image:

            radial-gradient(
              circle,
              white 1px,
              transparent 2px
            );

            background-size:55px 55px;

            animation:
            stars 15s linear infinite;

          }


          @keyframes stars{

            from{
              transform:translateY(0);
            }

            to{
              transform:translateY(55px);
            }

          }


          #menu{

            position:absolute;

            inset:0;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            gap:10px;

            z-index:10;

          }


          .title{

            font-size:
            clamp(30px,8vw,65px);

            font-weight:900;

            color:#ffd900;

            text-shadow:
            0 0 8px #ff7500,
            0 0 25px #ff3000;

          }


          .subtitle{

            color:#6edcff;

            font-weight:bold;

            margin-bottom:10px;

          }


          button{

            min-width:210px;

            padding:11px 25px;

            border:
            2px solid #50d8ff;

            border-radius:14px;

            background:
            linear-gradient(
              135deg,
              #14144d,
              #351067
            );

            color:white;

            font-size:17px;

            font-weight:bold;

            box-shadow:
            0 0 10px #285cff;

          }


          button:active{

            transform:scale(.93);

          }


          #battle{

            display:none;

            position:absolute;

            inset:0;

          }


          .hud{

            position:absolute;

            top:8px;

            left:8px;

            right:8px;

            z-index:5;

          }


          .bar{

            width:42%;

            height:19px;

            border:2px solid white;

            border-radius:10px;

            overflow:hidden;

            background:#111;

            display:inline-block;

          }


          .hp{

            width:100%;

            height:100%;

            background:
            linear-gradient(
              90deg,
              #1dff50,
              #00a83b
            );

          }


          .ki{

            width:100%;

            height:100%;

            background:
            linear-gradient(
              90deg,
              #32c8ff,
              #663cff
            );

          }


          #arena{

            position:absolute;

            inset:0;

            display:flex;

            justify-content:center;

            align-items:center;

          }


          .fighter{

            position:absolute;

            width:90px;

            height:130px;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            font-size:68px;

            filter:
            drop-shadow(
              0 0 12px #40cfff
            );

          }


          #player{

            left:20%;

            bottom:28%;

          }


          #enemy{

            right:20%;

            bottom:28%;

            filter:
            drop-shadow(
              0 0 12px #ff452f
            );

          }


          .aura{

            animation:
            aura .35s infinite alternate;

          }


          @keyframes aura{

            from{

              filter:
              drop-shadow(
                0 0 8px #36cfff
              );

            }

            to{

              filter:
              drop-shadow(
                0 0 30px white
              );

            }

          }


          #controls{

            position:absolute;

            bottom:10px;

            left:0;

            right:0;

            display:flex;

            justify-content:
            space-between;

            padding:10px;

          }


          .pad{

            display:grid;

            grid-template-columns:
            repeat(3,52px);

            gap:4px;

          }


          .action{

            display:grid;

            grid-template-columns:
            repeat(2,75px);

            gap:6px;

          }


          .small{

            min-width:52px;

            width:52px;

            height:52px;

            padding:0;

            font-size:20px;

          }


          .attack{

            min-width:75px;

            height:52px;

            padding:0;

            font-size:11px;

          }


          #msg{

            position:absolute;

            top:50%;

            left:50%;

            transform:
            translate(-50%,-50%);

            font-size:28px;

            font-weight:900;

            text-align:center;

            text-shadow:
            0 0 15px white;

            pointer-events:none;

            z-index:20;

          }

          </style>

          </head>


          <body>


          <div id="game">

          <div id="stars"></div>


          <div id="menu">

          <div class="title">
          🐉 DRAGON BALL
          </div>

          <div class="subtitle">
          ⚡ ULTIMATE WARRIORS
          </div>


          <button onclick="startGame()">
          🔥 PLAY
          </button>


          <button onclick="training()">
          🥋 TRAINING
          </button>


          <button onclick="missions()">
          🎯 MISSIONS
          </button>


          <button onclick="transform()">
          ⚡ TRANSFORM
          </button>


          <button onclick="shop()">
          💎 SHOP
          </button>

          </div>


          <div id="battle">


          <div class="hud">


          <div class="bar">

          <div
          id="php"
          class="hp">
          </div>

          </div>


          🟠 GOKU


          <span style="float:right">
          🔴 ENEMY
          </span>


          <div
          class="bar"
          style="float:right">

          <div
          id="ehp"
          class="hp">
          </div>

          </div>


          <br><br>


          <div class="bar">

          <div
          id="pki"
          class="ki">
          </div>

          </div>


          <div
          class="bar"
          style="float:right">

          <div
          id="eki"
          class="ki">
          </div>

          </div>


          </div>


          <div id="arena">


          <div
          id="player"
          class="fighter">

          🧑‍🦱

          <small>
          GOKU
          </small>

          </div>


          <div
          id="enemy"
          class="fighter">

          👹

          <small>
          ENEMY
          </small>

          </div>


          </div>


          <div id="msg"></div>


          <div id="controls">


          <div class="pad">


          <button class="small">
          ↖
          </button>


          <button
          class="small"
          onclick="move(0,-1)">
          ⬆
          </button>


          <button class="small">
          ↗
          </button>


          <button
          class="small"
          onclick="move(-1,0)">
          ⬅
          </button>


          <button class="small">
          ●
          </button>


          <button
          class="small"
          onclick="move(1,0)">
          ➡
          </button>


          <button class="small">
          ↙
          </button>


          <button
          class="small"
          onclick="move(0,1)">
          ⬇
          </button>


          <button class="small">
          ↘
          </button>


          </div>


          <div class="action">


          <button
          class="attack"
          onclick="attack()">
          👊 ATTACK
          </button>


          <button
          class="attack"
          onclick="kiBlast()">
          💥 KI
          </button>


          <button
          class="attack"
          onclick="beam()">
          🌟 BEAM
          </button>


          <button
          class="attack"
          onclick="charge()">
          ⚡ CHARGE
          </button>


          <button
          class="attack"
          onclick="transform()">
          🔥 FORM
          </button>


          <button
          class="attack"
          onclick="special()">
          ☄️ SPECIAL
          </button>


          </div>


          </div>


          </div>


          </div>


          <script>


          let playerHP=100;

          let enemyHP=100;

          let playerKi=100;

          let enemyKi=100;

          let level=1;

          let coins=0;

          let power=100;

          let transformed=false;


          const features=[];


          for(
            let i=1;
            i<=678;
            i++
          ){

            features.push({

              id:i,

              unlocked:i<=20,

              active:false,

              level:1

            });

          }


          function $(id){

            return document.getElementById(id);

          }


          function startGame(){

            $("menu").style.display="none";

            $("battle").style.display="block";

            reset();

            message(
              "🔥 BATTLE START!"
            );

          }


          function reset(){

            playerHP=100;

            enemyHP=100;

            playerKi=100;

            enemyKi=100;

            update();

          }


          function update(){

            $("php").style.width=
            Math.max(
              0,
              playerHP
            )+"%";

            $("ehp").style.width=
            Math.max(
              0,
              enemyHP
            )+"%";

            $("pki").style.width=
            Math.max(
              0,
              playerKi
            )+"%";

            $("eki").style.width=
            Math.max(
              0,
              enemyKi
            )+"%";

          }


          function damage(amount){

            enemyHP-=amount;


            if(enemyHP<=0){

              enemyHP=0;

              coins+=100;

              level++;

              power+=20;

              message(
                "🏆 VICTORY!"
              );

              setTimeout(
                reset,
                1500
              );

            }


            update();

          }


          function attack(){

            damage(
              transformed
              ? 18
              : 10
            );

            enemyAttack();

          }


          function kiBlast(){

            if(playerKi<10){

              message(
                "⚡ NO KI!"
              );

              return;

            }


            playerKi-=10;


            damage(
              transformed
              ? 28
              : 17
            );


            enemyAttack();

            update();

          }


          function beam(){

            if(playerKi<30){

              message(
                "🔵 KI LOW!"
              );

              return;

            }


            playerKi-=30;


            damage(
              transformed
              ? 50
              : 35
            );


            message(
              "💥 ENERGY BEAM!"
            );


            enemyAttack();

            update();

          }


          function special(){

            if(playerKi<50){

              message(
                "⚡ NEED 50 KI!"
              );

              return;

            }


            playerKi-=50;


            damage(
              transformed
              ? 80
              : 55
            );


            message(
              "🌟 ULTIMATE!"
            );


            enemyAttack();

            update();

          }


          function charge(){

            playerKi=
            Math.min(
              100,
              playerKi+25
            );


            message(
              "⚡ CHARGING KI"
            );


            update();

          }


          function enemyAttack(){

            setTimeout(()=>{

              let damage=
              Math.floor(
                Math.random()*10
              )+5;


              if(transformed){

                damage=
                Math.floor(
                  damage*.6
                );

              }


              playerHP-=damage;


              if(playerHP<=0){

                playerHP=0;

                message(
                  "💀 DEFEAT"
                );

                setTimeout(
                  reset,
                  1500
                );

              }


              update();

            },300);

          }


          function transform(){

            transformed=
            !transformed;


            const p=
            $("player");


            if(transformed){

              p.classList.add(
                "aura"
              );


              p.innerHTML=
              "🔥<small>SUPER</small>";


              power*=2;


              message(
                "⚡ TRANSFORMATION!"
              );


            }else{

              p.classList.remove(
                "aura"
              );


              p.innerHTML=
              "🧑‍🦱<small>GOKU</small>";


              power=
              Math.max(
                100,
                Math.floor(
                  power/2
                )
              );

            }


            update();

          }


          function move(x,y){

            const p=
            $("player");


            let left=
            parseFloat(
              getComputedStyle(p).left
            );


            let bottom=
            parseFloat(
              getComputedStyle(p).bottom
            );


            p.style.left=
            Math.max(
              5,
              Math.min(
                75,
                left+x*5
              )
            )+"%";


            p.style.bottom=
            Math.max(
              15,
              Math.min(
                75,
                bottom-y*5
              )
            )+"%";

          }


          function message(text){

            $("msg").innerText=text;


            setTimeout(()=>{

              $("msg").innerText="";

            },900);

          }


          function training(){

            message(
              "🥋 TRAINING!"
            );

            level++;

            power+=50;

          }


          function missions(){

            message(
              "🎯 MISSION COMPLETE!"
            );

            coins+=250;

          }


          function shop(){

            if(coins>=100){

              coins-=100;

              power+=50;

              message(
                "💎 POWER UP!"
              );

            }else{

              message(
                "💰 NEED 100 COINS"
              );

            }

          }


          update();

          </script>


          </body>

          </html>

          EOF


          # -------------------------
          # ANDROID
          # -------------------------

          npx cap add android

          npx cap sync android


      # =========================
      # GRADLE CONFIG
      # =========================

      - name: ⚙️ Configure Gradle
        run: |

          cd game/android

          cat > gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          org.gradle.daemon=false

          org.gradle.parallel=true

          org.gradle.caching=true

          android.useAndroidX=true

          android.enableJetifier=true

          android.nonTransitiveRClass=true

          android.enableR8.fullMode=true

          EOF


      # =========================
      # BUILD
      # =========================

      - name: 🔨 Build APK
        run: |

          cd game/android

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --parallel


      # =========================
      # SIZE
      # =========================

      - name: 📊 Check APK Size
        run: |

          echo "🐉 APK RESULT"

          find \
          game/android/app/build/outputs/apk/release \
          -name "*.apk" \
          -exec ls -lh {} \;


      # =========================
      # UPLOAD
      # =========================

      - name: 🚀 Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: DRAGON-BALL-678-APK

          path:
            game/android/app/build/outputs/apk/release/*.apk

          if-no-files-found: error