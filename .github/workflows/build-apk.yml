name: 🐉 DRAGON BALL STYLE - FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: 📥 Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 21
      # =========================================================

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # =========================================================
      # NODE 24
      # =========================================================

      - name: 🟢 Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: 📱 Setup Android
        uses: android-actions/setup-android@v3


      - name: 🛠️ Install Android SDK
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # =========================================================
      # IMAGE TOOLS
      # =========================================================

      - name: 🎨 Install ImageMagick
        run: |

          sudo apt-get update

          sudo apt-get install -y imagemagick


      # =========================================================
      # CREATE PROJECT
      # =========================================================

      - name: 🎮 Create Android Game
        run: |

          rm -rf game

          mkdir -p game

          cd game


          cat > package.json <<'EOF'
          {
            "name": "ultimate-warriors",
            "version": "1.0.0",
            "private": true,
            "description": "Ultimate Warriors Android Game",
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


          npm install --no-audit --no-fund


          npx cap init \
            "ULTIMATE WARRIORS" \
            "com.ultimatewarriors.game" \
            --web-dir=www


          mkdir -p www


      # =========================================================
      # CREATE GAME
      # =========================================================

      - name: 🐉 Create Full Game
        run: |

          cd game

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover">

          <title>ULTIMATE WARRIORS</title>

          <style>

          *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            user-select:none;
            -webkit-user-select:none;
            touch-action:none;
          }

          html,
          body{

            width:100%;
            height:100%;

            overflow:hidden;

            background:#000;

            color:white;

            font-family:
            Arial,
            Helvetica,
            sans-serif;
          }

          #game{

            position:fixed;

            inset:0;

            overflow:hidden;

            background:#02030a;
          }

          #canvas{

            position:absolute;

            inset:0;

            width:100%;
            height:100%;
          }

          #loading{

            position:absolute;

            inset:0;

            z-index:100;

            display:flex;

            align-items:center;

            justify-content:center;

            flex-direction:column;

            background:
            radial-gradient(
              circle,
              #18113d,
              #03030a 70%
            );
          }

          #loadingTitle{

            font-size:
            clamp(30px,8vw,65px);

            font-weight:900;

            color:#ffd21c;

            text-shadow:
            0 0 12px #ff8a00,
            0 0 30px #ff3600;
          }

          #loadingText{

            margin-top:20px;

            color:#66ddff;

            font-size:18px;
          }

          #loadingBar{

            width:min(80vw,420px);

            height:12px;

            margin-top:20px;

            border:1px solid white;

            border-radius:20px;

            overflow:hidden;

            background:#111;
          }

          #loadingProgress{

            width:0%;

            height:100%;

            background:
            linear-gradient(
              90deg,
              #00c8ff,
              #7c3cff,
              #ffd000
            );
          }

          #menu{

            position:absolute;

            inset:0;

            z-index:20;

            display:none;

            align-items:center;

            justify-content:center;

            flex-direction:column;

            gap:10px;

            background:
            radial-gradient(
              circle at 50% 40%,
              rgba(50,30,130,.65),
              rgba(0,0,0,.82) 70%
            );
          }

          .logo{

            font-size:
            clamp(35px,10vw,75px);

            font-weight:1000;

            letter-spacing:2px;

            color:#ffd21c;

            text-align:center;

            text-shadow:
            0 0 8px #ff9700,
            0 0 25px #ff3000,
            0 0 50px #ff1500;
          }

          .sub{

            color:#65dcff;

            font-weight:bold;

            letter-spacing:4px;

            margin-bottom:18px;
          }

          .menuButton{

            width:min(82vw,300px);

            height:50px;

            border-radius:14px;

            border:2px solid #48d9ff;

            color:white;

            font-size:17px;

            font-weight:bold;

            background:
            linear-gradient(
              135deg,
              #11144a,
              #37106c
            );

            box-shadow:
            0 0 12px #267aff;

          }

          .menuButton:active{

            transform:scale(.94);
          }

          #hud{

            position:absolute;

            inset:0;

            z-index:10;

            display:none;

            pointer-events:none;
          }

          .top{

            position:absolute;

            top:10px;

            left:10px;

            right:10px;

            display:flex;

            justify-content:space-between;

            gap:10px;
          }

          .fighterHud{

            width:44%;
          }

          .name{

            font-size:12px;

            font-weight:bold;

            margin-bottom:4px;
          }

          .bar{

            height:17px;

            border:2px solid white;

            border-radius:10px;

            background:#111;

            overflow:hidden;

            margin-bottom:4px;
          }

          .fill{

            width:100%;

            height:100%;
          }

          .health{

            background:
            linear-gradient(
              90deg,
              #22ff53,
              #00a532
            );
          }

          .energy{

            background:
            linear-gradient(
              90deg,
              #00cfff,
              #693cff
            );
          }

          #combo{

            position:absolute;

            top:100px;

            left:50%;

            transform:translateX(-50%);

            font-size:30px;

            font-weight:900;

            color:#ffd21c;

            text-shadow:
            0 0 15px #ff6a00;
          }

          #message{

            position:absolute;

            top:43%;

            left:50%;

            transform:
            translate(-50%,-50%);

            font-size:
            clamp(24px,7vw,55px);

            font-weight:1000;

            text-align:center;

            color:white;

            text-shadow:
            0 0 10px #fff,
            0 0 30px #38cfff;

            white-space:nowrap;
          }

          #controls{

            position:absolute;

            inset:0;

            z-index:30;

            display:none;

            pointer-events:none;
          }

          #joystick{

            position:absolute;

            left:20px;

            bottom:25px;

            width:130px;

            height:130px;

            border-radius:50%;

            border:2px solid rgba(255,255,255,.35);

            background:
            rgba(30,50,100,.25);

            pointer-events:auto;
          }

          #stick{

            position:absolute;

            width:60px;

            height:60px;

            left:33px;

            top:33px;

            border-radius:50%;

            background:
            radial-gradient(
              circle,
              #75eaff,
              #3656ff
            );

            box-shadow:
            0 0 20px #38cfff;
          }

          #buttons{

            position:absolute;

            right:15px;

            bottom:18px;

            width:220px;

            display:grid;

            grid-template-columns:
            repeat(3,1fr);

            gap:8px;

            pointer-events:auto;
          }

          .gameButton{

            height:55px;

            border-radius:50%;

            border:2px solid rgba(255,255,255,.7);

            color:white;

            font-size:11px;

            font-weight:bold;

            background:
            radial-gradient(
              circle,
              #2a2870,
              #120f32
            );

            box-shadow:
            0 0 10px #315fff;
          }

          .gameButton:active{

            transform:scale(.88);

            background:#5035aa;
          }

          #attack{

            width:70px;

            height:70px;

            grid-row:span 2;

            border-color:#ffca27;

            background:
            radial-gradient(
              circle,
              #a33722,
              #35100e
            );

            box-shadow:
            0 0 20px #ff5100;
          }

          #pause{

            position:absolute;

            top:10px;

            left:50%;

            transform:translateX(-50%);

            width:48px;

            height:35px;

            border-radius:10px;

            border:1px solid white;

            background:#1118;

            color:white;

            pointer-events:auto;
          }

          .hidden{

            display:none!important;
          }

          @media(
            orientation:portrait
          ){

            #controls{

              transform:scale(.86);

              transform-origin:
              bottom center;
            }
          }

          </style>

          </head>

          <body>

          <div id="game">

            <canvas id="canvas"></canvas>


            <div id="loading">

              <div id="loadingTitle">
                ULTIMATE WARRIORS
              </div>

              <div id="loadingText">
                LOADING ENERGY...
              </div>

              <div id="loadingBar">
                <div id="loadingProgress"></div>
              </div>

            </div>


            <div id="menu">

              <div class="logo">
                ULTIMATE
                <br>
                WARRIORS
              </div>

              <div class="sub">
                ANIME POWER BATTLE
              </div>

              <button
                class="menuButton"
                onclick="startBattle()">
                🔥 PLAY
              </button>

              <button
                class="menuButton"
                onclick="startTraining()">
                🎯 TRAINING
              </button>

              <button
                class="menuButton"
                onclick="transform()">
                ⚡ TRANSFORM
              </button>

              <button
                class="menuButton"
                onclick="saveGame()">
                💾 SAVE
              </button>

              <button
                class="menuButton"
                onclick="showStats()">
                📊 STATS
              </button>

            </div>


            <div id="hud">

              <div class="top">

                <div class="fighterHud">

                  <div class="name">
                    🟡 WARRIOR
                  </div>

                  <div class="bar">
                    <div
                      id="playerHp"
                      class="fill health">
                    </div>
                  </div>

                  <div class="bar">
                    <div
                      id="playerKi"
                      class="fill energy">
                    </div>
                  </div>

                </div>


                <div
                  class="fighterHud"
                  style="text-align:right">

                  <div class="name">
                    🔴 RIVAL
                  </div>

                  <div class="bar">
                    <div
                      id="enemyHp"
                      class="fill health">
                    </div>
                  </div>

                  <div class="bar">
                    <div
                      id="enemyKi"
                      class="fill energy">
                    </div>
                  </div>

                </div>

              </div>


              <div id="combo">
              </div>

              <div id="message">
              </div>

              <button
                id="pause"
                onclick="returnMenu()">
                II
              </button>

            </div>


            <div id="controls">

              <div id="joystick">

                <div id="stick"></div>

              </div>


              <div id="buttons">

                <button
                  id="attack"
                  class="gameButton"
                  onclick="attack()">
                  👊
                  <br>
                  ATTACK
                </button>

                <button
                  class="gameButton"
                  onclick="kiBlast()">
                  ⚡
                  <br>
                  KI
                </button>

                <button
                  class="gameButton"
                  onclick="dash()">
                  💨
                  <br>
                  DASH
                </button>

                <button
                  class="gameButton"
                  onclick="block()">
                  🛡️
                  <br>
                  BLOCK
                </button>

                <button
                  class="gameButton"
                  onclick="special()">
                  💥
                  <br>
                  SPECIAL
                </button>

                <button
                  class="gameButton"
                  onclick="ultimate()">
                  ☄️
                  <br>
                  ULTIMATE
                </button>

                <button
                  class="gameButton"
                  onclick="charge()">
                  🔋
                  <br>
                  CHARGE
                </button>

                <button
                  class="gameButton"
                  onclick="transform()">
                  🔥
                  <br>
                  FORM
                </button>

              </div>

            </div>

          </div>


          <script>

          /*
          =========================================================
          ULTIMATE WARRIORS
          Original lightweight anime-style battle engine.
          =========================================================
          */


          const canvas =
            document.getElementById("canvas");

          const ctx =
            canvas.getContext("2d");


          let W=innerWidth;
          let H=innerHeight;


          function resize(){

            W=innerWidth;
            H=innerHeight;

            canvas.width=W;
            canvas.height=H;

          }


          addEventListener(
            "resize",
            resize
          );

          resize();


          /*
          =========================================================
          GAME STATE
          =========================================================
          */

          let gameRunning=false;

          let training=false;

          let player={

            x:W*.28,

            y:H*.60,

            z:0,

            hp:100,

            ki:100,

            speed:5,

            attack:10,

            defense:5,

            power:100,

            transformed:false,

            blocking:false,

            combo:0

          };


          let enemy={

            x:W*.72,

            y:H*.60,

            z:0,

            hp:100,

            ki:100,

            speed:2,

            attack:7,

            defense:3,

            power:80

          };


          let coins=0;

          let xp=0;

          let level=1;

          let camera={

            x:0,

            y:0,

            shake:0,

            zoom:1

          };


          let particles=[];

          let attacks=[];

          let keys={};

          let joystick={

            x:0,

            y:0

          };


          /*
          =========================================================
          SAVE SYSTEM
          =========================================================
          */


          function saveGame(){

            const data={

              coins,

              xp,

              level,

              power:player.power,

              transformed:player.transformed

            };


            localStorage.setItem(
              "ultimate_warriors_save",
              JSON.stringify(data)
            );


            showMessage(
              "💾 GAME SAVED"
            );

          }


          function loadGame(){

            try{

              const raw=
                localStorage.getItem(
                  "ultimate_warriors_save"
                );


              if(!raw)
                return;


              const data=
                JSON.parse(raw);


              coins=
                data.coins||0;

              xp=
                data.xp||0;

              level=
                data.level||1;

              player.power=
                data.power||100;

              player.transformed=
                !!data.transformed;

            }catch(e){

              console.log(e);

            }

          }


          /*
          =========================================================
          INPUT
          =========================================================
          */


          addEventListener(
            "keydown",
            e=>{
              keys[e.key.toLowerCase()]=true;
            }
          );


          addEventListener(
            "keyup",
            e=>{
              keys[e.key.toLowerCase()]=false;
            }
          );


          /*
          =========================================================
          JOYSTICK
          =========================================================
          */


          const joy=
            document.getElementById(
              "joystick"
            );

          const stick=
            document.getElementById(
              "stick"
            );


          let joyActive=false;


          function joystickMove(e){

            const rect=
              joy.getBoundingClientRect();


            const p=
              e.touches?
              e.touches[0]:
              e;


            let x=
              p.clientX-
              (rect.left+rect.width/2);


            let y=
              p.clientY-
              (rect.top+rect.height/2);


            const max=42;

            const len=
              Math.sqrt(
                x*x+y*y
              );


            if(len>max){

              x=
                x/len*max;

              y=
                y/len*max;

            }


            stick.style.transform=
              `translate(${x}px,${y}px)`;


            joystick.x=
              x/max;

            joystick.y=
              y/max;

          }


          function joystickEnd(){

            joyActive=false;

            joystick.x=0;
            joystick.y=0;

            stick.style.transform=
              "translate(0,0)";

          }


          joy.addEventListener(
            "touchstart",
            e=>{
              joyActive=true;
              joystickMove(e);
            }
          );


          joy.addEventListener(
            "touchmove",
            e=>{
              if(joyActive)
                joystickMove(e);
            }
          );


          joy.addEventListener(
            "touchend",
            joystickEnd
          );


          /*
          =========================================================
          PARTICLES
          =========================================================
          */


          function particle(
            x,
            y,
            color="#fff",
            power=5
          ){

            for(
              let i=0;
              i<power;
              i++
            ){

              particles.push({

                x,

                y,

                vx:
                  (Math.random()-.5)
                  *12,

                vy:
                  (Math.random()-.5)
                  *12,

                life:1,

                size:
                  Math.random()*7+2,

                color

              });

            }

          }


          function updateParticles(){

            for(
              let i=particles.length-1;
              i>=0;
              i--
            ){

              const p=
                particles[i];


              p.x+=p.vx;

              p.y+=p.vy;

              p.vx*=.96;

              p.vy*=.96;

              p.life-=.025;


              if(p.life<=0){

                particles.splice(
                  i,
                  1
                );

              }

            }

          }


          function drawParticles(){

            for(
              const p of particles
            ){

              ctx.globalAlpha=
                p.life;

              ctx.fillStyle=
                p.color;

              ctx.beginPath();

              ctx.arc(
                p.x+camera.x,
                p.y+camera.y,
                p.size,
                0,
                Math.PI*2
              );

              ctx.fill();

            }

            ctx.globalAlpha=1;

          }


          /*
          =========================================================
          ENERGY AURA
          =========================================================
          */


          function aura(
            x,
            y,
            size,
            color
          ){

            const g=
              ctx.createRadialGradient(
                x,
                y,
                5,
                x,
                y,
                size
              );


            g.addColorStop(
              0,
              color
            );

            g.addColorStop(
              .25,
              color+"aa"
            );

            g.addColorStop(
              1,
              "transparent"
            );


            ctx.fillStyle=g;

            ctx.beginPath();

            ctx.arc(
              x,
              y,
              size,
              0,
              Math.PI*2
            );

            ctx.fill();

          }


          /*
          =========================================================
          3D STYLE CHARACTER
          =========================================================
          */


          function drawWarrior(
            f,
            color,
            glow
          ){

            const x=
              f.x+camera.x;

            const y=
              f.y+camera.y;


            const scale=
              camera.zoom+
              f.z*.001;


            aura(
              x,
              y,
              120*scale,
              glow
            );


            ctx.save();


            ctx.translate(
              x,
              y
            );


            ctx.scale(
              scale,
              scale
            );


            /*
            Body
            */

            ctx.fillStyle=
              color;

            ctx.beginPath();

            ctx.ellipse(
              0,
              35,
              28,
              55,
              0,
              0,
              Math.PI*2
            );

            ctx.fill();


            /*
            Head
            */

            ctx.fillStyle=
              "#ffd1a4";

            ctx.beginPath();

            ctx.arc(
              0,
              -25,
              25,
              0,
              Math.PI*2
            );

            ctx.fill();


            /*
            Hair
            */

            ctx.fillStyle=
              "#090909";

            ctx.beginPath();

            ctx.moveTo(
              -25,
              -30
            );

            ctx.lineTo(
              -18,
              -65
            );

            ctx.lineTo(
              -5,
              -40
            );

            ctx.lineTo(
              5,
              -70
            );

            ctx.lineTo(
              14,
              -42
            );

            ctx.lineTo(
              28,
              -60
            );

            ctx.lineTo(
              28,
              -20
            );

            ctx.closePath();

            ctx.fill();


            /*
            Arms
            */

            ctx.strokeStyle=
              "#ffd1a4";

            ctx.lineWidth=12;

            ctx.lineCap=
              "round";


            ctx.beginPath();

            ctx.moveTo(
              -22,
              10
            );

            ctx.lineTo(
              -55,
              40
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
              22,
              10
            );

            ctx.lineTo(
              55,
              35
            );

            ctx.stroke();


            /*
            Legs
            */

            ctx.strokeStyle=
              color;

            ctx.lineWidth=16;


            ctx.beginPath();

            ctx.moveTo(
              -12,
              70
            );

            ctx.lineTo(
              -25,
              110
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
              12,
              70
            );

            ctx.lineTo(
              25,
              110
            );

            ctx.stroke();


            ctx.restore();

          }


          /*
          =========================================================
          ARENA
          =========================================================
          */


          function drawArena(){

            const gradient=
              ctx.createLinearGradient(
                0,
                0,
                0,
                H
              );


            gradient.addColorStop(
              0,
              "#05061c"
            );

            gradient.addColorStop(
              .55,
              "#18125a"
            );

            gradient.addColorStop(
              1,
              "#030308"
            );


            ctx.fillStyle=
              gradient;

            ctx.fillRect(
              0,
              0,
              W,
              H
            );


            /*
            Stars
            */

            for(
              let i=0;
              i<80;
              i++
            ){

              const x=
                (i*137)%W;

              const y=
                (i*73)%(
                  H*.55
                );


              ctx.fillStyle=
                "rgba(255,255,255,.7)";

              ctx.fillRect(
                x,
                y,
                2,
                2
              );

            }


            /*
            3D floor
            */

            ctx.strokeStyle=
              "rgba(70,190,255,.2)";

            ctx.lineWidth=1;


            for(
              let i=-10;
              i<=10;
              i++
            ){

              const x=
                W/2+i*80;


              ctx.beginPath();

              ctx.moveTo(
                W/2,
                H*.55
              );

              ctx.lineTo(
                x,
                H
              );

              ctx.stroke();

            }


            for(
              let i=0;
              i<10;
              i++
            ){

              const y=
                H*.55+
                i*i*5;


              ctx.beginPath();

              ctx.moveTo(
                0,
                y
              );

              ctx.lineTo(
                W,
                y
              );

              ctx.stroke();

            }

          }


          /*
          =========================================================
          CAMERA
          =========================================================
          */


          function cameraShake(amount){

            camera.shake=
              Math.max(
                camera.shake,
                amount
              );

          }


          function updateCamera(){

            camera.x=
              (W/2-
              player.x)*.08;


            camera.y=
              (H*.55-
              player.y)*.05;


            if(camera.shake>0){

              camera.x+=
                (Math.random()-.5)
                *camera.shake;

              camera.y+=
                (Math.random()-.5)
                *camera.shake;

              camera.shake*=.85;

            }

          }


          /*
          =========================================================
          MOVEMENT
          =========================================================
          */


          function movement(){

            let dx=joystick.x;

            let dy=joystick.y;


            if(keys["a"])
              dx=-1;

            if(keys["d"])
              dx=1;

            if(keys["w"])
              dy=-1;

            if(keys["s"])
              dy=1;


            player.x+=
              dx*player.speed;

            player.y+=
              dy*player.speed;


            player.x=
              Math.max(
                50,
                Math.min(
                  W-50,
                  player.x
                )
              );


            player.y=
              Math.max(
                H*.30,
                Math.min(
                  H*.78,
                  player.y
                )
              );

          }


          /*
          =========================================================
          ENEMY AI
          =========================================================
          */


          function enemyAI(){

            if(training)
              return;


            const dx=
              player.x-
              enemy.x;


            const dy=
              player.y-
              enemy.y;


            const distance=
              Math.sqrt(
                dx*dx+
                dy*dy
              );


            if(distance>150){

              enemy.x+=
                dx/distance*
                enemy.speed;

              enemy.y+=
                dy/distance*
                enemy.speed;

            }else{

              if(
                Math.random()<.015
              ){

                enemyHit();

              }

            }

          }


          function enemyHit(){

            if(player.blocking){

              player.hp-=
                enemy.attack*.25;

              particle(
                player.x,
                player.y,
                "#60dfff",
                8
              );

              return;

            }


            player.hp-=
              enemy.attack;


            particle(
              player.x,
              player.y,
              "#ff4422",
              12
            );


            cameraShake(12);

            updateHud();

          }


          /*
          =========================================================
          ATTACKS
          =========================================================
          */


          function attack(){

            if(!gameRunning)
              return;


            const dx=
              enemy.x-
              player.x;

            const dy=
              enemy.y-
              player.y;


            const distance=
              Math.sqrt(
                dx*dx+
                dy*dy
              );


            if(distance>230){

              showMessage(
                "TOO FAR!"
              );

              return;

            }


            const damage=
              player.attack+
              (player.transformed?
              10:
              0)+
              Math.floor(
                Math.random()*8
              );


            enemy.hp-=
              Math.max(
                1,
                damage-
                enemy.defense
              );


            player.combo++;

            xp+=5;

            particle(
              enemy.x,
              enemy.y,
              "#ffd21c",
              20
            );


            cameraShake(16);


            showCombo();

            checkEnemy();

          }


          function kiBlast(){

            if(player.ki<10){

              showMessage(
                "NO KI!"
              );

              return;

            }


            player.ki-=10;


            const dx=
              enemy.x-
              player.x;

            const dy=
              enemy.y-
              player.y;


            const len=
              Math.sqrt(
                dx*dx+
                dy*dy
              );


            attacks.push({

              x:player.x,

              y:player.y,

              vx:dx/len*15,

              vy:dy/len*15,

              life:80,

              damage:
                player.power*.25

            });


            particle(
              player.x,
              player.y,
              "#4bdcff",
              15
            );


            updateHud();

          }


          function special(){

            if(player.ki<30){

              showMessage(
                "NEED 30 KI!"
              );

              return;

            }


            player.ki-=30;


            enemy.hp-=
              player.power*.45;


            particle(
              enemy.x,
              enemy.y,
              "#7c4dff",
              45
            );


            cameraShake(25);

            showMessage(
              "💥 SPECIAL!"
            );


            checkEnemy();

            updateHud();

          }


          function ultimate(){

            if(player.ki<70){

              showMessage(
                "NEED 70 KI!"
              );

              return;

            }


            player.ki-=70;


            enemy.hp-=
              player.power*
              (player.transformed?
              1.6:
              1.15);


            for(
              let i=0;
              i<100;
              i++
            ){

              particle(
                enemy.x,
                enemy.y,
                i%2?
                "#ffd21c":
                "#4cdcff",
                1
              );

            }


            cameraShake(45);

            showMessage(
              "☄️ ULTIMATE!"
            );


            checkEnemy();

            updateHud();

          }


          function dash(){

            const dx=
              enemy.x-
              player.x;


            player.x+=
              Math.sign(dx)*100;


            particle(
              player.x,
              player.y,
              "#66ddff",
              18
            );


            cameraShake(8);

          }


          function block(){

            player.blocking=
              !player.blocking;


            showMessage(
              player.blocking?
              "🛡️ BLOCK":
              "BLOCK OFF"
            );

          }


          function charge(){

            player.ki=
              Math.min(
                100,
                player.ki+25
              );


            particle(
              player.x,
              player.y,
              "#54dfff",
              25
            );


            showMessage(
              "⚡ CHARGING"
            );


            updateHud();

          }


          /*
          =========================================================
          TRANSFORMATION
          =========================================================
          */


          function transform(){

            player.transformed=
              !player.transformed;


            if(player.transformed){

              player.power*=2;

              player.speed+=2;

              player.attack+=5;

              showMessage(
                "🔥 TRANSFORMATION!"
              );


              particle(
                player.x,
                player.y,
                "#ffd21c",
                70
              );


              cameraShake(30);

            }else{

              player.power=
                Math.max(
                  100,
                  player.power/2
                );

              player.speed=
                Math.max(
                  5,
                  player.speed-2
                );

              player.attack=
                Math.max(
                  10,
                  player.attack-5
                );

              showMessage(
                "FORM OFF"
              );

            }


            saveGame();

          }


          /*
          =========================================================
          ENEMY CHECK
          =========================================================
          */


          function checkEnemy(){

            if(enemy.hp<=0){

              enemy.hp=0;

              coins+=100;

              xp+=50;

              level+=
                xp>=level*100?
                1:
                0;


              showMessage(
                "🏆 VICTORY!"
              );


              setTimeout(
                resetBattle,
                1600
              );

            }


            updateHud();

          }


          function resetBattle(){

            enemy.hp=100;

            enemy.ki=100;

            player.hp=100;

            player.ki=100;

            enemy.x=
              W*.72;

            enemy.y=
              H*.60;

            player.x=
              W*.28;

            player.y=
              H*.60;

            player.combo=0;

            updateHud();

            saveGame();

          }


          /*
          =========================================================
          HUD
          =========================================================
          */


          function updateHud(){

            document
              .getElementById(
                "playerHp"
              )
              .style.width=
              Math.max(
                0,
                player.hp
              )+"%";


            document
              .getElementById(
                "playerKi"
              )
              .style.width=
              Math.max(
                0,
                player.ki
              )+"%";


            document
              .getElementById(
                "enemyHp"
              )
              .style.width=
              Math.max(
                0,
                enemy.hp
              )+"%";


            document
              .getElementById(
                "enemyKi"
              )
              .style.width=
              Math.max(
                0,
                enemy.ki
              )+"%";

          }


          function showCombo(){

            const c=
              document.getElementById(
                "combo"
              );


            c.innerText=
              player.combo>1?
              player.combo+" HIT COMBO":
              "";

          }


          function showMessage(text){

            const m=
              document.getElementById(
                "message"
              );


            m.innerText=text;


            setTimeout(
              ()=>{
                if(
                  m.innerText===text
                )
                  m.innerText="";
              },
              900
            );

          }


          function showStats(){

            showMessage(
              "LV "+level+
              " • XP "+xp+
              " • COINS "+coins
            );

          }


          /*
          =========================================================
          GAME LOOP
          =========================================================
          */


          function update(){

            if(!gameRunning)
              return;


            movement();

            enemyAI();

            updateCamera();

            updateParticles();


            for(
              let i=attacks.length-1;
              i>=0;
              i--
            ){

              const a=
                attacks[i];


              a.x+=a.vx;

              a.y+=a.vy;

              a.life--;


              particle(
                a.x,
                a.y,
                "#4bdcff",
                1
              );


              const dx=
                a.x-enemy.x;

              const dy=
                a.y-enemy.y;


              if(
                Math.sqrt(
                  dx*dx+
                  dy*dy
                )<55
              ){

                enemy.hp-=
                  a.damage;


                cameraShake(18);


                particle(
                  enemy.x,
                  enemy.y,
                  "#5bdfff",
                  25
                );


                attacks.splice(
                  i,
                  1
                );


                checkEnemy();

                continue;

              }


              if(a.life<=0){

                attacks.splice(
                  i,
                  1
                );

              }

            }


            if(
              player.hp<=0
            ){

              player.hp=100;

              showMessage(
                "💀 DEFEAT"
              );

            }


            updateHud();

          }


          function draw(){

            drawArena();


            drawWarrior(
              enemy,
              "#a52b36",
              "#ff321f"
            );


            drawWarrior(
              player,
              player.transformed?
              "#ff9d12":
              "#3b55d8",
              player.transformed?
              "#ffd21c":
              "#35bfff"
            );


            /*
            Energy attacks
            */

            for(
              const a of attacks
            ){

              ctx.fillStyle=
                "#4ceaff";

              ctx.shadowBlur=25;

              ctx.shadowColor=
                "#4ceaff";

              ctx.beginPath();

              ctx.arc(
                a.x+camera.x,
                a.y+camera.y,
                13,
                0,
                Math.PI*2
              );

              ctx.fill();

              ctx.shadowBlur=0;

            }


            drawParticles();

          }


          function loop(){

            update();

            draw();

            requestAnimationFrame(
              loop
            );

          }


          /*
          =========================================================
          MENUS
          =========================================================
          */


          function startBattle(){

            training=false;

            gameRunning=true;

            document
              .getElementById(
                "menu"
              )
              .style.display="none";


            document
              .getElementById(
                "hud"
              )
              .style.display="block";


            document
              .getElementById(
                "controls"
              )
              .style.display="block";


            resetBattle();

            showMessage(
              "🔥 BATTLE START!"
            );

          }


          function startTraining(){

            training=true;

            gameRunning=true;

            document
              .getElementById(
                "menu"
              )
              .style.display="none";


            document
              .getElementById(
                "hud"
              )
              .style.display="block";


            document
              .getElementById(
                "controls"
              )
              .style.display="block";


            resetBattle();

            showMessage(
              "🎯 TRAINING MODE"
            );

          }


          function returnMenu(){

            gameRunning=false;

            document
              .getElementById(
                "hud"
              )
              .style.display="none";


            document
              .getElementById(
                "controls"
              )
              .style.display="none";


            document
              .getElementById(
                "menu"
              )
              .style.display="flex";


            saveGame();

          }


          /*
          =========================================================
          LOADING
          =========================================================
          */


          loadGame();


          let progress=0;


          const loadingTimer=
            setInterval(
              ()=>{

                progress+=5;


                document
                  .getElementById(
                    "loadingProgress"
                  )
                  .style.width=
                  progress+"%";


                if(progress>=100){

                  clearInterval(
                    loadingTimer
                  );


                  setTimeout(
                    ()=>{

                      document
                        .getElementById(
                          "loading"
                        )
                        .style.display=
                        "none";


                      document
                        .getElementById(
                          "menu"
                        )
                        .style.display=
                        "flex";

                    },
                    400
                  );

                }

              },
              60
            );


          loop();

          </script>

          </body>

          </html>
          EOF


