name: 🐉 DRAGON BALL SPARKING ZERO - FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: 📥 Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 21
      # ==========================================

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # NODE 24
      # ==========================================

      - name: 🟢 Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛠️ Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ==========================================
      # CREATE PROJECT
      # ==========================================

      - name: 🎮 Create Project
        run: |

          rm -rf game

          mkdir -p game
          cd game

          cat > package.json <<'EOF'
          {
            "name": "dragon-ball-sparking-zero",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo build"
            },
            "dependencies": {
              "@capacitor/core": "7.4.0",
              "@capacitor/android": "7.4.0",
              "@capacitor/cli": "7.4.0"
            }
          }
          EOF

          npm install --no-audit --no-fund

          mkdir -p www

          npx cap init \
            "DRAGON BALL SPARKING ZERO" \
            "com.ultimatewarriors.game" \
            --web-dir=www


      # ==========================================
      # GAME
      # ==========================================

      - name: 🐉 Create Game
        run: |

          cd game

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no">

          <title>DRAGON BALL SPARKING ZERO</title>

          <style>

          *{
            box-sizing:border-box;
            user-select:none;
            -webkit-user-select:none;
            touch-action:none;
          }

          html,
          body{

            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;

            background:#000;

            font-family:
            Arial,
            sans-serif;

            color:white;
          }

          #game{

            position:fixed;

            inset:0;

            overflow:hidden;

            background:
            radial-gradient(
              circle at 50% 50%,
              #19194a 0%,
              #07071b 40%,
              #000 100%
            );
          }

          /* SPACE */

          #space{

            position:absolute;

            inset:0;

            opacity:.7;

            background-image:
            radial-gradient(
              circle,
              white 1px,
              transparent 1.5px
            );

            background-size:
            42px 42px;

            animation:
            stars 18s linear infinite;
          }

          @keyframes stars{

            from{
              transform:
              translateY(0);
            }

            to{
              transform:
              translateY(42px);
            }
          }

          /* MENU */

          #menu{

            position:absolute;

            inset:0;

            z-index:10;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            gap:9px;

            background:
            radial-gradient(
              circle,
              rgba(30,30,100,.35),
              rgba(0,0,0,.9)
            );
          }

          .logo{

            font-size:
            clamp(
              27px,
              8vw,
              65px
            );

            font-weight:900;

            color:#ffd21a;

            text-align:center;

            text-shadow:
            0 0 8px #ff9d00,
            0 0 25px #ff5a00,
            0 0 45px #ff2600;

            margin-bottom:4px;
          }

          .sub{

            font-size:
            clamp(
              14px,
              4vw,
              24px
            );

            font-weight:bold;

            color:#62d9ff;

            text-shadow:
            0 0 15px #008cff;

            margin-bottom:15px;
          }

          button{

            min-width:210px;

            min-height:48px;

            border:2px solid #4edcff;

            border-radius:13px;

            color:white;

            font-weight:bold;

            font-size:16px;

            background:
            linear-gradient(
              135deg,
              #11113c,
              #34106c
            );

            box-shadow:
            0 0 10px #147bff;

            transition:.1s;
          }

          button:active{

            transform:scale(.92);

            box-shadow:
            0 0 25px #fff;
          }

          /* BATTLE */

          #battle{

            display:none;

            position:absolute;

            inset:0;
          }

          #arena{

            position:absolute;

            inset:0;

            background:

            radial-gradient(
              ellipse at 50% 80%,
              #392400,
              transparent 35%
            ),

            linear-gradient(
              #050515,
              #10102c
            );
          }

          /* CAMERA */

          #camera{

            position:absolute;

            inset:0;

            transform:
            scale(1);

            transition:
            transform .08s;
          }

          .shake{

            animation:
            cameraShake .18s;
          }

          @keyframes cameraShake{

            0%{
              transform:
              translate(0,0)
              scale(1);
            }

            25%{
              transform:
              translate(-7px,4px)
              scale(1.03);
            }

            50%{
              transform:
              translate(7px,-5px)
              scale(1.05);
            }

            75%{
              transform:
              translate(-4px,-3px)
              scale(1.03);
            }

            100%{
              transform:
              translate(0,0)
              scale(1);
            }
          }

          /* 3D ARENA */

          .floor{

            position:absolute;

            left:-20%;

            right:-20%;

            bottom:-25%;

            height:60%;

            transform:
            perspective(500px)
            rotateX(62deg);

            background:
            repeating-linear-gradient(
              90deg,
              rgba(70,110,160,.18)
              0 2px,
              transparent 2px 70px
            ),

            repeating-linear-gradient(
              0deg,
              rgba(70,110,160,.15)
              0 2px,
              transparent 2px 70px
            );
          }

          /* FIGHTERS */

          .fighter{

            position:absolute;

            width:110px;

            height:160px;

            bottom:27%;

            display:flex;

            align-items:center;

            justify-content:center;

            flex-direction:column;

            font-size:75px;

            z-index:4;

            transition:
            left .1s,
            bottom .1s;
          }

          #player{

            left:18%;

            filter:
            drop-shadow(
              0 0 12px #00aaff
            );
          }

          #enemy{

            right:18%;

            filter:
            drop-shadow(
              0 0 12px #ff3300
            );
          }

          .aura{

            animation:
            aura .25s infinite alternate;
          }

          @keyframes aura{

            from{

              filter:
              drop-shadow(
                0 0 8px #00aaff
              )
              drop-shadow(
                0 0 20px #0055ff
              );
            }

            to{

              filter:
              drop-shadow(
                0 0 30px #fff
              )
              drop-shadow(
                0 0 50px #00bfff
              );
            }
          }

          /* KI BLAST */

          .blast{

            position:absolute;

            width:35px;

            height:35px;

            border-radius:50%;

            background:
            radial-gradient(
              circle,
              white,
              #48dfff,
              #185dff,
              transparent
            );

            box-shadow:
            0 0 25px #00bfff,
            0 0 50px #145eff;

            z-index:6;

            animation:
            blast .35s linear forwards;
          }

          @keyframes blast{

            from{
              transform:scale(.5);
              opacity:1;
            }

            to{
              transform:
              translateX(350px)
              scale(1.8);
              opacity:0;
            }
          }

          /* HUD */

          .hud{

            position:absolute;

            top:8px;

            left:8px;

            right:8px;

            z-index:20;
          }

          .row{

            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:6px;
          }

          .bar{

            width:40%;

            height:18px;

            border:2px solid white;

            border-radius:10px;

            overflow:hidden;

            background:#090909;
          }

          .hp{

            width:100%;

            height:100%;

            background:
            linear-gradient(
              90deg,
              #00ff55,
              #00a52d
            );
          }

          .ki{

            width:100%;

            height:100%;

            background:
            linear-gradient(
              90deg,
              #19caff,
              #613cff
            );
          }

          /* CONTROLS */

          #controls{

            position:absolute;

            left:0;

            right:0;

            bottom:7px;

            z-index:30;

            display:flex;

            justify-content:
            space-between;

            align-items:end;

            padding:7px;
          }

          #dpad{

            display:grid;

            grid-template-columns:
            repeat(3,50px);

            gap:4px;
          }

          .action{

            display:grid;

            grid-template-columns:
            repeat(2,70px);

            gap:5px;
          }

          .control{

            min-width:0;

            width:50px;

            height:50px;

            padding:0;

            border-radius:50%;

            font-size:20px;
          }

          .action button{

            width:70px;

            min-width:70px;

            height:48px;

            min-height:48px;

            font-size:11px;
          }

          #msg{

            position:absolute;

            left:50%;

            top:48%;

            transform:
            translate(-50%,-50%);

            z-index:50;

            font-size:
            clamp(22px,6vw,45px);

            font-weight:900;

            text-align:center;

            color:white;

            text-shadow:
            0 0 10px #fff,
            0 0 30px #00aaff;
          }

          /* RESPONSIVE */

          @media(
            orientation:portrait
          ){

            .fighter{
              bottom:34%;
            }

            #controls{
              bottom:3px;
            }

          }

          </style>

          </head>

          <body>

          <div id="game">

            <div id="space"></div>

            <div id="menu">

              <div class="logo">
                🐉 DRAGON BALL
              </div>

              <div class="sub">
                ⚡ SPARKING ZERO ⚡
              </div>

              <button onclick="startGame()">
                🔥 PLAY
              </button>

              <button onclick="training()">
                🎯 TRAINING
              </button>

              <button onclick="missions()">
                🏆 MISSIONS
              </button>

              <button onclick="transform()">
                ⚡ TRANSFORM
              </button>

              <button onclick="shop()">
                💎 SHOP
              </button>

            </div>

            <div id="battle">

              <div id="camera">

                <div id="arena">

                  <div class="floor"></div>

                </div>

                <div class="hud">

                  <div class="row">

                    <div>
                      🟠 GOKU
                    </div>

                    <div class="bar">
                      <div
                        id="php"
                        class="hp">
                      </div>
                    </div>

                    <div class="bar">
                      <div
                        id="ehp"
                        class="hp">
                      </div>
                    </div>

                    <div>
                      🔴 ENEMY
                    </div>

                  </div>

                  <br>

                  <div class="row">

                    <div class="bar">
                      <div
                        id="pki"
                        class="ki">
                      </div>
                    </div>

                    <div class="bar">
                      <div
                        id="eki"
                        class="ki">
                      </div>
                    </div>

                  </div>

                </div>

                <div
                  id="player"
                  class="fighter">

                  🧑‍🦱

                  <small>
                    GOKU
                  </small>

                </div>

                <div
                  id="enemy"
                  class="fighter">

                  👹

                  <small>
                    ENEMY
                  </small>

                </div>

                <div id="msg"></div>

                <div id="controls">

                  <div id="dpad">

                    <button
                      class="control">
                    ↖
                    </button>

                    <button
                      class="control"
                      onclick="move(0,-1)">
                    ⬆
                    </button>

                    <button
                      class="control">
                    ↗
                    </button>

                    <button
                      class="control"
                      onclick="move(-1,0)">
                    ⬅
                    </button>

                    <button
                      class="control">
                    ●
                    </button>

                    <button
                      class="control"
                      onclick="move(1,0)">
                    ➡
                    </button>

                    <button
                      class="control">
                    ↙
                    </button>

                    <button
                      class="control"
                      onclick="move(0,1)">
                    ⬇
                    </button>

                    <button
                      class="control">
                    ↘
                    </button>

                  </div>

                  <div class="action">

                    <button
                      onclick="attack()">
                      👊 ATK
                    </button>

                    <button
                      onclick="kiBlast()">
                      💥 KI
                    </button>

                    <button
                      onclick="beam()">
                      🔵 BEAM
                    </button>

                    <button
                      onclick="charge()">
                      ⚡ KI
                    </button>

                    <button
                      onclick="transform()">
                      🔥 FORM
                    </button>

                    <button
                      onclick="special()">
                      ☄️ ULT
                    </button>

                  </div>

                </div>

              </div>

            </div>

          </div>

          <script>

          let playerHP=100;
          let enemyHP=100;

          let playerKi=100;
          let enemyKi=100;

          let coins=
            Number(
              localStorage.getItem(
                "coins"
              ) || 0
            );

          let level=
            Number(
              localStorage.getItem(
                "level"
              ) || 1
            );

          let power=
            Number(
              localStorage.getItem(
                "power"
              ) || 100
            );

          let transformed=false;

          const $=
            id=>
            document.getElementById(id);

          function save(){

            localStorage.setItem(
              "coins",
              coins
            );

            localStorage.setItem(
              "level",
              level
            );

            localStorage.setItem(
              "power",
              power
            );
          }

          function startGame(){

            $("menu").style.display=
              "none";

            $("battle").style.display=
              "block";

            reset();

            message(
              "🔥 BATTLE START!"
            );
          }

          function reset(){

            playerHP=100;

            enemyHP=100;

            playerKi=100;

            enemyKi=100;

            update();
          }

          function update(){

            $("php").style.width=
              Math.max(
                0,
                playerHP
              )+"%";

            $("ehp").style.width=
              Math.max(
                0,
                enemyHP
              )+"%";

            $("pki").style.width=
              Math.max(
                0,
                playerKi
              )+"%";

            $("eki").style.width=
              Math.max(
                0,
                enemyKi
              )+"%";

            save();
          }

          function shake(){

            const c=$("camera");

            c.classList.remove(
              "shake"
            );

            void c.offsetWidth;

            c.classList.add(
              "shake"
            );
          }

          function damage(amount){

            enemyHP-=amount;

            shake();

            if(enemyHP<=0){

              enemyHP=0;

              coins+=100;

              level++;

              power+=20;

              message(
                "🏆 VICTORY!"
              );

              save();

              setTimeout(
                reset,
                1400
              );
            }

            update();
          }

          function attack(){

            damage(
              transformed
              ? 20
              : 10
            );

            enemyAttack();
          }

          function kiBlast(){

            if(playerKi<10){

              message(
                "⚡ NO KI!"
              );

              return;
            }

            playerKi-=10;

            damage(
              transformed
              ? 30
              : 18
            );

            enemyAttack();

            update();
          }

          function beam(){

            if(playerKi<30){

              message(
                "🔵 KI LOW!"
              );

              return;
            }

            playerKi-=30;

            damage(
              transformed
              ? 55
              : 35
            );

            shake();

            message(
              "💥 ENERGY BEAM!"
            );

            enemyAttack();

            update();
          }

          function special(){

            if(playerKi<50){

              message(
                "⚡ NEED 50 KI!"
              );

              return;
            }

            playerKi-=50;

            damage(
              transformed
              ? 85
              : 60
            );

            shake();

            message(
              "🌟 ULTIMATE ATTACK!"
            );

            enemyAttack();

            update();
          }

          function charge(){

            playerKi=
              Math.min(
                100,
                playerKi+25
              );

            message(
              "⚡ CHARGING KI"
            );

            update();
          }

          function enemyAttack(){

            setTimeout(()=>{

              if(enemyHP<=0)
                return;

              let d=
                Math.floor(
                  Math.random()*10
                )+5;

              if(transformed)
                d*=0.6;

              playerHP-=d;

              if(playerHP<=0){

                playerHP=0;

                message(
                  "💀 DEFEAT"
                );

                setTimeout(
                  reset,
                  1400
                );
              }

              update();

            },350);
          }

          function transform(){

            transformed=
              !transformed;

            const p=$("player");

            if(transformed){

              p.classList.add(
                "aura"
              );

              p.innerHTML=
                "🔥<small>SUPER</small>";

              power*=2;

              message(
                "⚡ TRANSFORMATION!"
              );

            }else{

              p.classList.remove(
                "aura"
              );

              p.innerHTML=
                "🧑‍🦱<small>GOKU</small>";

              power=
                Math.max(
                  100,
                  Math.floor(
                    power/2
                  )
                );

              message(
                "NORMAL FORM"
              );
            }

            update();
          }

          function move(x,y){

            const p=$("player");

            let left=
              parseFloat(
                getComputedStyle(p)
                .left
              );

            let bottom=
              parseFloat(
                getComputedStyle(p)
                .bottom
              );

            p.style.left=
              Math.max(
                5,
                Math.min(
                  80,
                  left+x*5
                )
              )+"%";

            p.style.bottom=
              Math.max(
                15,
                Math.min(
                  75,
                  bottom-y*5
                )
              )+"%";
          }

          function message(text){

            $("msg").innerText=text;

            setTimeout(()=>{

              $("msg").innerText="";

            },1000);
          }

          function training(){

            coins+=50;

            power+=25;

            level++;

            save();

            message(
              "🎯 TRAINING COMPLETE!"
            );
          }

          function missions(){

            coins+=250;

            level++;

            save();

            message(
              "🏆 MISSION COMPLETE!"
            );
          }

          function shop(){

            if(coins>=100){

              coins-=100;

              power+=50;

              save();

              message(
                "💎 POWER UP!"
              );

            }else{

              message(
                "💰 NEED 100 COINS"
              );
            }
          }

          update();

          </script>

          </body>

          </html>
          EOF


      # ==========================================
      # ADD ANDROID
      # ==========================================

      - name: 📱 Add Android
        run: |

          cd game

          npx cap add android

          npx cap sync android


      # ==========================================
      # CREATE GOLDEN G ICON
      # ==========================================

      - name: 🖤 Create Golden G Icon
        run: |

          cd game

          python3 -m pip install --quiet pillow

          cat > create_icon.py <<'PY'
          from PIL import Image, ImageDraw

          SIZE = 512

          img = Image.new(
              "RGBA",
              (SIZE, SIZE),
              (0,0,0,255)
          )

          draw = ImageDraw.Draw(img)

          cx = SIZE // 2
          cy = SIZE // 2

          # Golden G
          outer = 175
          inner = 112

          draw.ellipse(
              (
                  cx-outer,
                  cy-outer,
                  cx+outer,
                  cy+outer
              ),
              fill=(255,195,20,255)
          )

          draw.ellipse(
              (
                  cx-inner,
                  cy-inner,
                  cx+inner,
                  cy+inner
              ),
              fill=(0,0,0,255)
          )

          # G opening
          draw.rectangle(
              (
                  cx,
                  cy-18,
                  cx+105,
                  cy+25
              ),
              fill=(0,0,0,255)
          )

          # G bar
          draw.rectangle(
              (
                  cx-5,
                  cy-4,
                  cx+100,
                  cy+35
              ),
              fill=(255,195,20,255)
          )

          # Gold center
          draw.rectangle(
              (
                  cx+30,
                  cy-2,
                  cx+75,
                  cy+30
              ),
              fill=(255,195,20,255)
          )

          # subtle glow
          for i in range(12):

              r = outer + i*3

              alpha = max(
                  0,
                  70-i*5
              )

              draw.ellipse(
                  (
                      cx-r,
                      cy-r,
                      cx+r,
                      cy+r
                  ),
                  outline=(
                      255,
                      195,
                      20,
                      alpha
                  ),
                  width=3
              )

          img.save(
              "icon.png"
          )
          PY

          python3 create_icon.py


      # ==========================================
      # INSTALL IMAGE MAGICK
      # ==========================================

      - name: 🖼️ Install ImageMagick
        run: |

          sudo apt-get update

          sudo apt-get install -y imagemagick


      # ==========================================
      # CREATE CORRECT ANDROID ICONS
      # ==========================================

      - name: 🎨 Install App Icons
        run: |

          cd game

          RES="android/app/src/main/res"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          convert icon.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/icon.png"

          convert icon.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/icon.png"

          convert icon.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/icon.png"

          convert icon.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/icon.png"

          convert icon.png \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/icon.png"

          # ROUND ICON
          convert icon.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/icon_round.png"

          convert icon.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/icon_round.png"

          convert icon.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/icon_round.png"

          convert icon.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/icon_round.png"

          convert icon.png \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/icon_round.png"


      # ==========================================
      # FIX MANIFEST
      # ==========================================

      - name: 🔧 Fix Android Manifest
        run: |

          cd game

          python3 - <<'PY'

          from pathlib import Path

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = p.read_text()

          text = text.replace(
              "@mipmap/ic_launcher",
              "@mipmap/icon"
          )

          text = text.replace(
              "@mipmap/ic_launcher_round",
              "@mipmap/icon_round"
          )

          text = text.replace(
              "@mipmap/icon_round",
              "@mipmap/icon_round"
          )

          p.write_text(text)

          PY


      # ==========================================
      # APP NAME
      # ==========================================

      - name: 🐉 Set App Name
        run: |

          cd game

          python3 - <<'PY'

          from pathlib import Path

          p=Path(
            "android/app/src/main/res/values/strings.xml"
          )

          p.parent.mkdir(
            parents=True,
            exist_ok=True
          )

          p.write_text(
          '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">DRAGON BALL SPARKING ZERO</string>
              <string name="title_activity_main">DRAGON BALL SPARKING ZERO</string>
          </resources>
          '''
          )

          PY


      # ==========================================
      # GRADLE SETTINGS
      # ==========================================

      - name: ⚙️ Configure Gradle
        run: |

          cd game/android

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


      # ==========================================
      # CREATE SIGNING KEY
      # ==========================================

      - name: 🔐 Create Release Key
        run: |

          mkdir -p game/keystore

          keytool \
            -genkeypair \
            -v \
            -keystore game/keystore/dragonball.jks \
            -alias dragonball \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dragonball123 \
            -keypass dragonball123 \
            -dname "CN=Dragon Ball Sparking Zero, OU=Game, O=Ultimate Warriors, L=Saudi Arabia, ST=Asir, C=SA"


      # ==========================================
      # BUILD
      # ==========================================

      - name: 🔨 Build Release APK
        run: |

          cd game/android

          chmod +x gradlew

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # ==========================================
      # SIGN
      # ==========================================

      - name: 🔏 Sign APK
        run: |

          APK=$(find \
            game/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK NOT FOUND"
            exit 1
          fi

          apksigner sign \
            --ks game/keystore/dragonball.jks \
            --ks-key-alias dragonball \
            --ks-pass pass:dragonball123 \
            --key-pass pass:dragonball123 \
            "$APK"


      # ==========================================
      # VERIFY
      # ==========================================

      - name: 🔍 Verify APK
        run: |

          APK=$(find \
            game/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          apksigner verify \
            --verbose \
            "$APK"

          echo ""
          echo "===================================="
          echo "🐉 BUILD SUCCESS"
          echo "===================================="

          ls -lh "$APK"


      # ==========================================
      # RENAME
      # ==========================================

      - name: 🐉 Rename APK
        run: |

          APK=$(find \
            game/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" \
            "DRAGON-BALL-SPARKING-ZERO-FINAL.apk"


      # ==========================================
      # UPLOAD
      # ==========================================

      - name: 🚀 Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: DRAGON-BALL-SPARKING-ZERO-FINAL

          path: DRAGON-BALL-SPARKING-ZERO-FINAL.apk

          if-no-files-found: error