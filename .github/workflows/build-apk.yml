name: 🐉 DRAGON BALL ULTIMATE WARRIORS - 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: 📥 Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 21
      # ============================================================

      - name: ☕ Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # NODE 24
      # ============================================================

      - name: 🟢 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: 📱 Setup Android
        uses: android-actions/setup-android@v3


      - name: 🛠️ Install Android SDK
        run: |

          sdkmanager "platform-tools"

          sdkmanager "platforms;android-35"

          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # CREATE PROJECT
      # ============================================================

      - name: 🎮 Create Project
        run: |

          mkdir -p game

          cd game

          cat > package.json <<'EOF'
          {
            "name": "dragon-ball-ultimate-warriors",
            "version": "1.0.0",
            "private": true,
            "description": "Original anime inspired 3D fighting game",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^7.4.0",
              "@capacitor/core": "^7.4.0",
              "@capacitor/cli": "^7.4.0",
              "three": "^0.178.0",
              "vite": "^7.1.0"
            }
          }
          EOF


      # ============================================================
      # INSTALL
      # ============================================================

      - name: 📦 Install NPM Packages
        run: |

          cd game

          npm install


      # ============================================================
      # CAPACITOR CONFIG
      # ============================================================

      - name: ⚡ Create Capacitor Config
        run: |

          cd game

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.goku.ultimatewarriors",
            "appName": "DRAGON BALL ULTIMATE WARRIORS",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


      # ============================================================
      # VITE CONFIG
      # ============================================================

      - name: ⚙️ Create Vite Config
        run: |

          cd game

          cat > vite.config.js <<'EOF'
          import { defineConfig } from "vite";

          export default defineConfig({
            base: "./",
            build: {
              target: "es2020",
              sourcemap: false,
              minify: "esbuild"
            }
          });
          EOF


      # ============================================================
      # HTML
      # ============================================================

      - name: 🌐 Create HTML
        run: |

          cd game

          mkdir -p src

          cat > index.html <<'EOF'
          <!DOCTYPE html>

          <html lang="en">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width,
              initial-scale=1,
              maximum-scale=1,
              user-scalable=no,
              viewport-fit=cover">

            <meta
              name="theme-color"
              content="#000000">

            <title>
              DRAGON BALL ULTIMATE WARRIORS
            </title>

          </head>

          <body>

            <div id="loading">

              <div class="loading-title">
                🐉 DRAGON BALL
              </div>

              <div class="loading-subtitle">
                ULTIMATE WARRIORS
              </div>

              <div class="loader">

                <div
                  id="loaderBar">
                </div>

              </div>

              <div id="loadingText">
                LOADING 3D WORLD...
              </div>

            </div>


            <div id="menu">

              <div class="logo">
                G
              </div>

              <h1>
                DRAGON BALL
              </h1>

              <h2>
                ULTIMATE WARRIORS
              </h2>

              <button
                onclick="Game.start()">
                🔥 PLAY
              </button>

              <button
                onclick="Game.training()">
                🎯 TRAINING
              </button>

              <button
                onclick="Game.story()">
                📖 STORY
              </button>

              <button
                onclick="Game.shop()">
                💎 SHOP
              </button>

              <div
                id="stats">
              </div>

            </div>


            <div id="game">

              <canvas
                id="canvas">
              </canvas>


              <div id="hud">

                <div class="topHud">

                  <div class="playerInfo">

                    <b>
                      HERO
                    </b>

                    <div class="bar hp">
                      <div
                        id="hpBar">
                      </div>
                    </div>

                    <div class="bar ki">
                      <div
                        id="kiBar">
                      </div>
                    </div>

                  </div>


                  <div class="lock">

                    <span>
                      TARGET
                    </span>

                    <div
                      id="targetName">
                      ENEMY
                    </div>

                    <div class="bar enemyHp">
                      <div
                        id="enemyHpBar">
                      </div>
                    </div>

                  </div>

                </div>


                <div id="combatText">
                </div>


                <div
                  id="score">
                </div>

              </div>


              <div id="touch">

                <div
                  id="joystick">

                  <div
                    id="stick">
                  </div>

                </div>


                <div class="actions">

                  <button
                    class="attack"
                    onclick="Game.attack()">
                    👊
                  </button>

                  <button
                    onclick="Game.kiBlast()">
                    💥
                  </button>

                  <button
                    onclick="Game.dash()">
                    💨
                  </button>

                  <button
                    onclick="Game.block()">
                    🛡️
                  </button>

                  <button
                    onclick="Game.charge()">
                    ⚡
                  </button>

                  <button
                    onclick="Game.special()">
                    🌟
                  </button>

                  <button
                    onclick="Game.transform()">
                    🔥
                  </button>

                  <button
                    onclick="Game.fly()">
                    🚀
                  </button>

                </div>

              </div>

            </div>


            <style>

              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-user-select: none;
                touch-action: none;
              }

              html,
              body {

                width: 100%;
                height: 100%;

                overflow: hidden;

                background: #000;

                color: white;

                font-family:
                  Arial,
                  Helvetica,
                  sans-serif;

              }


              #loading {

                position: fixed;

                inset: 0;

                z-index: 100;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: center;

                background:
                  radial-gradient(
                    circle,
                    #151515,
                    #000 70%
                  );

              }


              .loading-title {

                font-size: 42px;

                font-weight: 900;

                color: #ffd21c;

                text-shadow:
                  0 0 10px #ff8a00,
                  0 0 35px #ff4d00;

              }


              .loading-subtitle {

                margin-top: 8px;

                color: #62d9ff;

                font-weight: bold;

              }


              .loader {

                width: 70%;

                max-width: 500px;

                height: 10px;

                margin-top: 30px;

                background: #222;

                border-radius: 20px;

                overflow: hidden;

              }


              #loaderBar {

                width: 0%;

                height: 100%;

                background:
                  linear-gradient(
                    90deg,
                    #ffd000,
                    #ff7300,
                    #fff
                  );

              }


              #loadingText {

                margin-top: 12px;

                font-size: 13px;

                color: #aaa;

              }


              #menu {

                position: fixed;

                inset: 0;

                z-index: 50;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: center;

                gap: 10px;

                background:
                  radial-gradient(
                    circle at center,
                    #24185c,
                    #080812 55%,
                    #000
                  );

              }


              .logo {

                width: 120px;

                height: 120px;

                border-radius: 50%;

                display: flex;

                align-items: center;

                justify-content: center;

                font-size: 100px;

                font-weight: 900;

                color: #ffd21c;

                background: #000;

                border: 4px solid #ffd21c;

                box-shadow:
                  0 0 20px #ffd21c,
                  0 0 70px #ff8a00;

              }


              #menu h1 {

                font-size:
                  clamp(30px, 8vw, 65px);

                color: #ffd21c;

                text-shadow:
                  0 0 15px #ff6600;

              }


              #menu h2 {

                color: #68dfff;

                font-size: 18px;

                letter-spacing: 4px;

              }


              button {

                border: 2px solid #53d8ff;

                background:
                  linear-gradient(
                    135deg,
                    #14142f,
                    #3b1464
                  );

                color: white;

                border-radius: 14px;

                min-width: 190px;

                min-height: 48px;

                padding: 8px 18px;

                font-size: 16px;

                font-weight: 900;

                box-shadow:
                  0 0 12px #254dff;

              }


              button:active {

                transform: scale(.9);

              }


              #stats {

                margin-top: 10px;

                color: #ffd21c;

              }


              #game {

                display: none;

                position: fixed;

                inset: 0;

                background: #000;

              }


              #canvas {

                width: 100%;

                height: 100%;

                display: block;

              }


              #hud {

                position: fixed;

                inset: 0;

                pointer-events: none;

              }


              .topHud {

                display: flex;

                justify-content:
                  space-between;

                padding: 12px;

              }


              .playerInfo,
              .lock {

                width: 38%;

                min-width: 150px;

              }


              .bar {

                width: 100%;

                height: 14px;

                margin-top: 4px;

                border:
                  2px solid white;

                border-radius: 20px;

                background: #111;

                overflow: hidden;

              }


              .bar div {

                width: 100%;

                height: 100%;

              }


              #hpBar,
              #enemyHpBar {

                background:
                  linear-gradient(
                    90deg,
                    #1cff4d,
                    #00a33c
                  );

              }


              #kiBar {

                background:
                  linear-gradient(
                    90deg,
                    #28d9ff,
                    #7048ff
                  );

              }


              #combatText {

                position: absolute;

                top: 43%;

                width: 100%;

                text-align: center;

                font-size: 32px;

                font-weight: 900;

                text-shadow:
                  0 0 15px white,
                  0 0 30px #00c8ff;

              }


              #score {

                position: absolute;

                top: 100px;

                left: 50%;

                transform:
                  translateX(-50%);

                font-weight: bold;

                color: #ffd21c;

              }


              #touch {

                position: fixed;

                left: 0;

                right: 0;

                bottom: 0;

                padding: 18px;

                display: flex;

                justify-content:
                  space-between;

                align-items:
                  flex-end;

              }


              #joystick {

                width: 135px;

                height: 135px;

                border-radius: 50%;

                border:
                  2px solid #6bdfff;

                background:
                  rgba(
                    30,
                    70,
                    120,
                    .35
                  );

                position: relative;

              }


              #stick {

                position: absolute;

                width: 58px;

                height: 58px;

                border-radius: 50%;

                left: 37px;

                top: 37px;

                background:
                  radial-gradient(
                    circle,
                    #fff,
                    #54dfff,
                    #1d4fff
                  );

                box-shadow:
                  0 0 20px #35dfff;

              }


              .actions {

                width: 190px;

                display: grid;

                grid-template-columns:
                  repeat(4, 1fr);

                gap: 7px;

              }


              .actions button {

                min-width: 0;

                width: 43px;

                height: 43px;

                padding: 0;

                font-size: 20px;

              }


              .actions .attack {

                border-color: #ff7a32;

                box-shadow:
                  0 0 15px #ff4b00;

              }


              @media (
                orientation: portrait
              ) {

                #menu {

                  padding: 10px;

                }

                #menu h1 {

                  font-size: 30px;

                }

                .logo {

                  width: 90px;
                  height: 90px;
                  font-size: 75px;

                }

              }

            </style>

          </body>

          </html>
          EOF


      # ============================================================
      # THREE.JS GAME
      # ============================================================

      - name: 🧠 Create 3D Game Engine
        run: |

          cd game

          cat > src/main.js <<'EOF'

          import * as THREE from "three";

          import {
            OrbitControls
          } from "three/examples/jsm/controls/OrbitControls.js";


          // ========================================================
          // SAVE DATA
          // ========================================================

          const SAVE_KEY =
            "DB_ULTIMATE_WARRIORS_SAVE";


          let save = {

            level: 1,

            xp: 0,

            coins: 0,

            power: 100,

            speed: 100,

            energy: 100,

            transformation: false

          };


          try {

            const old =
              localStorage.getItem(
                SAVE_KEY
              );

            if (old) {

              save =
                Object.assign(
                  save,
                  JSON.parse(old)
                );

            }

          } catch (_) {}


          function saveGame() {

            localStorage.setItem(
              SAVE_KEY,
              JSON.stringify(save)
            );

            updateStats();

          }


          function updateStats() {

            const el =
              document.getElementById(
                "stats"
              );

            if (!el) return;

            el.innerText =
              `LV ${save.level}   •   XP ${save.xp}   •   💎 ${save.coins}`;

          }


          // ========================================================
          // THREE.JS
          // ========================================================

          const canvas =
            document.getElementById(
              "canvas"
            );


          const renderer =
            new THREE.WebGLRenderer({

              canvas,

              antialias: true,

              powerPreference:
                "high-performance"

            });


          renderer.setPixelRatio(
            Math.min(
              window.devicePixelRatio,
              2
            )
          );


          renderer.setSize(
            innerWidth,
            innerHeight
          );


          renderer.shadowMap.enabled = true;


          const scene =
            new THREE.Scene();


          scene.background =
            new THREE.Color(
              0x02030a
            );


          scene.fog =
            new THREE.FogExp2(
              0x050618,
              0.018
            );


          const camera =
            new THREE.PerspectiveCamera(

              65,

              innerWidth /
                innerHeight,

              .1,

              2000

            );


          camera.position.set(
            0,
            8,
            18
          );


          // ========================================================
          // LIGHT
          // ========================================================

          const ambient =
            new THREE.HemisphereLight(
              0x8fcfff,
              0x080018,
              2
            );

          scene.add(ambient);


          const sun =
            new THREE.DirectionalLight(
              0xffffff,
              3
            );

          sun.position.set(
            20,
            40,
            20
          );

          sun.castShadow = true;

          scene.add(sun);


          // ========================================================
          // WORLD
          // ========================================================

          const world =
            new THREE.Group();

          scene.add(world);


          const ground =
            new THREE.Mesh(

              new THREE.PlaneGeometry(
                1800,
                1800
              ),

              new THREE.MeshStandardMaterial({

                color: 0x191a27,

                roughness: .85,

                metalness: .05

              })

            );


          ground.rotation.x =
            -Math.PI / 2;

          ground.receiveShadow = true;

          world.add(ground);


          // ========================================================
          // ARENA
          // ========================================================

          const arena =
            new THREE.Mesh(

              new THREE.CylinderGeometry(
                38,
                42,
                2,
                64
              ),

              new THREE.MeshStandardMaterial({

                color: 0x353542,

                roughness: .7

              })

            );


          arena.position.y = 1;

          arena.receiveShadow = true;

          world.add(arena);


          // ========================================================
          // RINGS
          // ========================================================

          for (
            let r = 10;
            r <= 35;
            r += 5
          ) {

            const ring =
              new THREE.Mesh(

                new THREE.TorusGeometry(
                  r,
                  .06,
                  8,
                  64
                ),

                new THREE.MeshBasicMaterial({

                  color:
                    0x245eff

                })

              );

            ring.rotation.x =
              Math.PI / 2;

            ring.position.y =
              2.05;

            world.add(ring);

          }


          // ========================================================
          // STARS
          // ========================================================

          const starGeometry =
            new THREE.BufferGeometry();


          const starCount = 1800;

          const starPositions =
            new Float32Array(
              starCount * 3
            );


          for (
            let i = 0;
            i < starCount;
            i++
          ) {

            starPositions[i*3] =
              (Math.random()-.5)*1200;

            starPositions[i*3+1] =
              Math.random()*500+30;

            starPositions[i*3+2] =
              (Math.random()-.5)*1200;

          }


          starGeometry.setAttribute(

            "position",

            new THREE.BufferAttribute(
              starPositions,
              3
            )

          );


          const stars =
            new THREE.Points(

              starGeometry,

              new THREE.PointsMaterial({

                color: 0xffffff,

                size: 1.5

              })

            );


          scene.add(stars);


          // ========================================================
          // FIGHTER CREATOR
          // ========================================================

          function createFighter(
            color,
            auraColor
          ) {

            const root =
              new THREE.Group();


            const body =
              new THREE.Mesh(

                new THREE.CapsuleGeometry(
                  1,
                  2.4,
                  8,
                  16
                ),

                new THREE.MeshStandardMaterial({

                  color,

                  roughness: .45,

                  metalness: .1

                })

              );


            body.position.y = 3;

            body.castShadow = true;

            root.add(body);


            const head =
              new THREE.Mesh(

                new THREE.SphereGeometry(
                  1.05,
                  20,
                  20
                ),

                new THREE.MeshStandardMaterial({

                  color: 0xffc58f

                })

              );


            head.position.y = 5.2;

            head.castShadow = true;

            root.add(head);


            const aura =
              new THREE.Mesh(

                new THREE.SphereGeometry(
                  2.5,
                  20,
                  20
                ),

                new THREE.MeshBasicMaterial({

                  color: auraColor,

                  transparent: true,

                  opacity: .08,

                  side:
                    THREE.BackSide

                })

              );


            aura.position.y = 3;

            root.add(aura);


            root.userData = {

              body,

              head,

              aura,

              auraColor,

              hp: 100,

              ki: 100,

              blocking: false,

              flying: false

            };


            return root;

          }


          const player =
            createFighter(
              0x176cff,
              0x32cfff
            );


          player.position.set(
            -10,
            2,
            0
          );


          world.add(player);


          const enemy =
            createFighter(
              0xff3030,
              0xff4422
            );


          enemy.position.set(
            10,
            2,
            0
          );


          world.add(enemy);


          enemy.rotation.y =
            Math.PI;


          // ========================================================
          // LOCK ON
          // ========================================================

          let locked = true;


          function lookAtEnemy() {

            if (!locked) return;

            const target =
              enemy.position.clone();

            target.y =
              player.position.y + 3;

            const direction =
              target
                .sub(player.position)
                .normalize();


            const angle =
              Math.atan2(
                direction.x,
                direction.z
              );


            player.rotation.y =
              angle;

          }


          // ========================================================
          // EFFECTS
          // ========================================================

          const effects =
            new THREE.Group();

          scene.add(effects);


          function energySphere(
            position,
            color,
            size
          ) {

            const mesh =
              new THREE.Mesh(

                new THREE.SphereGeometry(
                  size,
                  16,
                  16
                ),

                new THREE.MeshBasicMaterial({

                  color,

                  transparent: true,

                  opacity: .9

                })

              );


            mesh.position.copy(
              position
            );

            effects.add(mesh);


            return mesh;

          }


          function beam() {

            const start =
              player.position.clone();

            start.y += 4;


            const end =
              enemy.position.clone();

            end.y += 3;


            const direction =
              end.clone()
                .sub(start);


            const length =
              direction.length();


            const mesh =
              new THREE.Mesh(

                new THREE.CylinderGeometry(
                  .45,
                  .8,
                  length,
                  16
                ),

                new THREE.MeshBasicMaterial({

                  color: 0x58d9ff

                })

              );


            mesh.position.copy(
              start.clone().add(
                direction.clone()
                  .multiplyScalar(.5)
              )
            );


            mesh.quaternion.setFromUnitVectors(

              new THREE.Vector3(
                0,
                1,
                0
              ),

              direction.normalize()

            );


            effects.add(mesh);


            setTimeout(
              () => {
                effects.remove(mesh);
              },
              180
            );

          }


          function explosion(
            position,
            color
          ) {

            for (
              let i = 0;
              i < 16;
              i++
            ) {

              const p =
                energySphere(
                  position,
                  color,
                  .15
                );


              p.userData.velocity =
                new THREE.Vector3(

                  Math.random()-.5,

                  Math.random()-.2,

                  Math.random()-.5

                ).multiplyScalar(1.5);

            }

          }


          // ========================================================
          // DAMAGE
          // ========================================================

          function damageEnemy(
            amount
          ) {

            if (
              enemy.userData.hp <= 0
            )
              return;


            enemy.userData.hp =
              Math.max(
                0,
                enemy.userData.hp -
                  amount
              );


            explosion(
              enemy.position.clone()
                .add(
                  new THREE.Vector3(
                    0,3,0
                  )
                ),
              0x55ccff
            );


            if (
              enemy.userData.hp <= 0
            ) {

              save.xp += 100;

              save.coins += 150;

              save.level =
                Math.max(
                  1,
                  Math.floor(
                    save.xp / 500
                  ) + 1
                );


              showText(
                "🏆 VICTORY!"
              );


              setTimeout(
                resetBattle,
                1800
              );


              saveGame();

            }

          }


          // ========================================================
          // PLAYER DAMAGE
          // ========================================================

          function damagePlayer(
            amount
          ) {

            if (
              player.userData.blocking
            ) {

              amount *= .25;

            }


            player.userData.hp =
              Math.max(
                0,
                player.userData.hp -
                  amount
              );


            if (
              player.userData.hp <= 0
            ) {

              showText(
                "💀 DEFEAT"
              );

              setTimeout(
                resetBattle,
                1800
              );

            }

          }


          // ========================================================
          // COMBAT
          // ========================================================

          let combo = 0;

          let lastAttack = 0;


          function attack() {

            const now =
              performance.now();


            if (
              now - lastAttack < 220
            )
              return;


            lastAttack = now;

            combo++;


            if (
              combo > 5
            )
              combo = 1;


            const damage =
              8 +
              combo * 3 +
              (
                save.transformation
                ? 15
                : 0
              );


            damageEnemy(
              damage
            );


            showText(
              `👊 COMBO x${combo}`
            );

          }


          function kiBlast() {

            if (
              player.userData.ki < 15
            ) {

              showText(
                "⚡ LOW KI"
              );

              return;

            }


            player.userData.ki -=
              15;


            const direction =
              new THREE.Vector3(
                0,
                0,
                1
              );


            direction.applyQuaternion(
              player.quaternion
            );


            const projectile =
              energySphere(

                player.position.clone()
                  .add(
                    new THREE.Vector3(
                      0,3.5,0
                    )
                  ),

                0x42d9ff,

                .5

              );


            projectile.userData.velocity =
              direction.multiplyScalar(2);


            projectile.userData.projectile =
              true;


            showText(
              "💥 KI BLAST!"
            );


            damageEnemy(
              save.transformation
              ? 30
              : 20
            );

          }


          function special() {

            if (
              player.userData.ki < 45
            ) {

              showText(
                "⚡ NEED 45 KI"
              );

              return;

            }


            player.userData.ki -=
              45;


            beam();


            damageEnemy(
              save.transformation
              ? 75
              : 50
            );


            showText(
              "🌟 ULTIMATE!"
            );

          }


          function charge() {

            player.userData.ki =
              Math.min(
                100,
                player.userData.ki +
                  35
              );


            showText(
              "⚡ CHARGING"
            );

          }


          function block() {

            player.userData.blocking =
              !player.userData.blocking;


            showText(
              player.userData.blocking
              ? "🛡️ BLOCK"
              : "⚔️ READY"
            );

          }


          function dash() {

            const forward =
              new THREE.Vector3(
                0,
                0,
                1
              );


            forward.applyQuaternion(
              player.quaternion
            );


            player.position.add(
              forward.multiplyScalar(4)
            );


            explosion(
              player.position,
              0x38cfff
            );

          }


          function fly() {

            player.userData.flying =
              !player.userData.flying;


            showText(
              player.userData.flying
              ? "🚀 FLIGHT"
              : "⬇️ LAND"
            );

          }


          function transform() {

            save.transformation =
              !save.transformation;


            const aura =
              player.userData.aura;


            aura.material.opacity =
              save.transformation
              ? .35
              : .08;


            aura.scale.setScalar(
              save.transformation
              ? 1.6
              : 1
            );


            showText(
              save.transformation
              ? "🔥 TRANSFORMATION!"
              : "⚡ NORMAL FORM"
            );


            saveGame();

          }


          // ========================================================
          // ENEMY AI
          // ========================================================

          let enemyTimer = 0;


          function enemyAI(
            delta
          ) {

            if (
              enemy.userData.hp <= 0
            )
              return;


            const direction =
              player.position.clone()
                .sub(
                  enemy.position
                );


            direction.y = 0;


            const distance =
              direction.length();


            if (
              distance > 7
            ) {

              direction.normalize();

              enemy.position.add(
                direction.multiplyScalar(
                  delta * .9
                )
              );

            }


            enemy.lookAt(
              player.position.x,
              enemy.position.y + 3,
              player.position.z
            );


            enemyTimer += delta;


            if (
              distance < 10 &&
              enemyTimer > 1.3
            ) {

              enemyTimer = 0;

              damagePlayer(
                6 +
                Math.floor(
                  Math.random()*7
                )
              );

            }

          }


          // ========================================================
          // RESET
          // ========================================================

          function resetBattle() {

            player.userData.hp = 100;

            player.userData.ki = 100;

            enemy.userData.hp = 100;

            player.position.set(
              -10,
              2,
              0
            );

            enemy.position.set(
              10,
              2,
              0
            );

            combo = 0;

          }


          // ========================================================
          // UI
          // ========================================================

          function showText(
            text
          ) {

            const el =
              document.getElementById(
                "combatText"
              );


            el.innerText = text;


            setTimeout(
              () => {

                if (
                  el.innerText === text
                )
                  el.innerText = "";

              },
              700
            );

          }


          function updateUI() {

            document.getElementById(
              "hpBar"
            ).style.width =
              player.userData.hp + "%";


            document.getElementById(
              "kiBar"
            ).style.width =
              player.userData.ki + "%";


            document.getElementById(
              "enemyHpBar"
            ).style.width =
              enemy.userData.hp + "%";


            document.getElementById(
              "score"
            ).innerText =
              `LV ${save.level} • XP ${save.xp} • 💎 ${save.coins}`;

          }


          // ========================================================
          // MENU
          // ========================================================

          const Game = {

            start() {

              document.getElementById(
                "menu"
              ).style.display =
                "none";


              document.getElementById(
                "game"
              ).style.display =
                "block";


              resetBattle();


              showText(
                "🔥 BATTLE START!"
              );

            },


            training() {

              save.xp += 50;

              save.power += 10;

              saveGame();

              showText(
                "🎯 TRAINING COMPLETE"
              );

            },


            story() {

              save.xp += 100;

              save.coins += 50;

              saveGame();

              showText(
                "📖 STORY MISSION"
              );

            },


            shop() {

              if (
                save.coins >= 100
              ) {

                save.coins -= 100;

                save.power += 25;

                save.energy += 10;

                saveGame();

                showText(
                  "💎 POWER UPGRADE!"
                );

              } else {

                showText(
                  "💰 NEED 100 COINS"
                );

              }

            },

            attack,

            kiBlast,

            dash,

            block,

            charge,

            special,

            transform,

            fly

          };


          window.Game = Game;


          // ========================================================
          // JOYSTICK
          // ========================================================

          const joystick =
            document.getElementById(
              "joystick"
            );


          const stick =
            document.getElementById(
              "stick"
            );


          let joystickActive =
            false;


          let joystickX = 0;

          let joystickY = 0;


          function joystickMove(
            event
          ) {

            const rect =
              joystick.getBoundingClientRect();


            const point =
              event.touches
              ? event.touches[0]
              : event;


            let x =
              point.clientX -
              rect.left -
              rect.width/2;


            let y =
              point.clientY -
              rect.top -
              rect.height/2;


            const max =
              rect.width/2 -
              30;


            const length =
              Math.sqrt(
                x*x + y*y
              );


            if (
              length > max
            ) {

              x =
                x / length * max;

              y =
                y / length * max;

            }


            joystickX =
              x / max;

            joystickY =
              y / max;


            stick.style.transform =
              `translate(${x}px,${y}px)`;

          }


          function joystickEnd() {

            joystickActive = false;

            joystickX = 0;

            joystickY = 0;

            stick.style.transform =
              "translate(0,0)";

          }


          joystick.addEventListener(
            "touchstart",
            e => {

              joystickActive = true;

              joystickMove(e);

            },
            {
              passive: false
            }
          );


          joystick.addEventListener(
            "touchmove",
            e => {

              e.preventDefault();

              joystickMove(e);

            },
            {
              passive: false
            }
          );


          joystick.addEventListener(
            "touchend",
            joystickEnd
          );


          // ========================================================
          // CAMERA
          // ========================================================

          const cameraTarget =
            new THREE.Vector3();


          function updateCamera() {

            const desired =
              new THREE.Vector3(
                0,
                7,
                17
              );


            desired.applyQuaternion(
              player.quaternion
            );


            desired.add(
              player.position
            );


            camera.position.lerp(
              desired,
              .08
            );


            cameraTarget.copy(
              player.position
            );


            cameraTarget.y += 3;


            camera.lookAt(
              cameraTarget
            );

          }


          // ========================================================
          // MOVEMENT
          // ========================================================

          function movement(
            delta
          ) {

            if (
              Math.abs(joystickX) < .05 &&
              Math.abs(joystickY) < .05
            )
              return;


            const speed =
              save.transformation
              ? 12
              : 8;


            const forward =
              new THREE.Vector3(
                0,
                0,
                1
              );


            forward.applyQuaternion(
              player.quaternion
            );


            const right =
              new THREE.Vector3(
                1,
                0,
                0
              );


            right.applyQuaternion(
              player.quaternion
            );


            player.position.add(

              forward.multiplyScalar(
                -joystickY *
                speed *
                delta
              )

            );


            player.position.add(

              right.multiplyScalar(
                joystickX *
                speed *
                delta
              )

            );


            if (
              player.userData.flying
            ) {

              player.position.y =
                7 +
                Math.sin(
                  performance.now()/300
                ) * .8;

            } else {

              player.position.y =
                2;

            }

          }


          // ========================================================
          // ANIMATION LOOP
          // ========================================================

          const clock =
            new THREE.Clock();


          function animate() {

            requestAnimationFrame(
              animate
            );


            const delta =
              Math.min(
                clock.getDelta(),
                .05
              );


            movement(delta);

            enemyAI(delta);

            lookAtEnemy();

            updateCamera();

            updateUI();


            // Aura animation

            const pulse =
              1 +
              Math.sin(
                performance.now()/120
              ) * .08;


            player.userData.aura
              .scale.setScalar(
                save.transformation
                ? 1.6 * pulse
                : pulse
              );


            // Effects

            for (
              let i =
                effects.children.length-1;
              i >= 0;
              i--
            ) {

              const obj =
                effects.children[i];


              if (
                obj.userData.velocity
              ) {

                obj.position.add(
                  obj.userData.velocity
                );

                obj.userData.velocity
                  .multiplyScalar(.94);

              }


              obj.scale.multiplyScalar(
                .96
              );


              if (
                obj.scale.x < .03
              ) {

                effects.remove(obj);

              }

            }


            renderer.render(
              scene,
              camera
            );

          }


          // ========================================================
          // RESIZE
          // ========================================================

          window.addEventListener(
            "resize",
            () => {

              camera.aspect =
                innerWidth /
                innerHeight;

              camera.updateProjectionMatrix();

              renderer.setSize(
                innerWidth,
                innerHeight
              );

            }
          );


          // ========================================================
          // START
          // ========================================================

          updateStats();


          let loading = 0;


          const loadingTimer =
            setInterval(
              () => {

                loading += 5;


                document.getElementById(
                  "loaderBar"
                ).style.width =
                  loading + "%";


                if (
                  loading >= 100
                ) {

                  clearInterval(
                    loadingTimer
                  );


                  document.getElementById(
                    "loading"
                  ).style.display =
                    "none";

                }

              },
              35
            );


          animate();

          EOF


