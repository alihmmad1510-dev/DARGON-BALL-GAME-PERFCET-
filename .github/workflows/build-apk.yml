      # ============================================================

      - name: 🖤 Create Golden G Icon
        run: |

          cd game

          python3 -m pip install --quiet Pillow


          python3 - <<'PY'

          from PIL import Image, ImageDraw

          SIZE = 512

          img = Image.new(
              "RGBA",
              (SIZE, SIZE),
              (0,0,0,255)
          )

          draw = ImageDraw.Draw(img)

          cx = SIZE // 2

          cy = SIZE // 2

          outer = 170

          inner = 105


          # GOLDEN CIRCLE

          draw.ellipse(

              (
                cx-outer,
                cy-outer,
                cx+outer,
                cy+outer
              ),

              fill=(255,195,20,255)

          )


          # BLACK CENTER

          draw.ellipse(

              (
                cx-inner,
                cy-inner,
                cx+inner,
                cy+inner
              ),

              fill=(0,0,0,255)

          )


          # OPEN THE G

          draw.rectangle(

              (
                cx,
                cy-18,
                cx+110,
                cy+35
              ),

              fill=(0,0,0,255)

          )


          # G BAR

          draw.rectangle(

              (
                cx-5,
                cy-5,
                cx+100,
                cy+35
              ),

              fill=(255,195,20,255)

          )


          # GOLDEN ENERGY RINGS

          for i in range(8):

              r = outer + 5 + i*4

              alpha = max(
                  0,
                  90-i*10
              )

              draw.ellipse(

                  (
                    cx-r,
                    cy-r,
                    cx+r,
                    cy+r
                  ),

                  outline=(
                    255,
                    195,
                    20,
                    alpha
                  ),

                  width=3

              )


          img.save(
              "golden-g.png"
          )

          PY


